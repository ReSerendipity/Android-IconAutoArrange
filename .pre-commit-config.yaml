# 本地提交前钩子（可选安装：pre-commit install）
#
# 设计原则：最小、确定 —— 只做通用卫生 + shell 静态检查。
# 排除实验产物目录，避免触达二进制 / 生成物。
exclude: ^poc/artifacts/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
