version: 2
updates:
  # 本仓无 pip / npm / cargo 等包管理器；唯一受管依赖面是 GitHub Actions 工作流。
  # 限流防噪：monthly + 最多 5 个 PR + 屏蔽所有跨大版本（semver-major）跃迁。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
